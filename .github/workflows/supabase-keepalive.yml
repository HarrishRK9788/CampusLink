
name: Keep Supabase Alive (Direct API)

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Check Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Required GitHub Secrets are missing."
            exit 1
          fi

          echo "Checking Supabase database..."

          curl --silent --show-error --fail-with-body \
            --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/departments?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"

          echo
          echo "Database API request succeeded."
